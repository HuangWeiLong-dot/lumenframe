name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 同一时间只允许一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必须是 22+：@supabase/supabase-js 的 engines 要求 node >=22
          # （2.116.0 起；最后支持 20 的版本是 2.105.0）
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # 在仓库 Settings → Pages 选 "GitHub Actions" 作为发布源
          # 在 Settings → Secrets and variables → Actions → Variables 配置：
          #   API_BASE（必填）：Linux 服务器上的 API 域名，如 https://api.example.com
          #   BASE_PATH（可选）：默认 './'（相对路径，同时兼容 /<repo>/ 项目地址与自定义根域名）；
          #                     仅在有特殊需求时覆盖
          #   FILMGRAB_BASE（可选）：剧照服务挂载前缀，如
          #                     https://api.example.com/filmgrab；不部署则留空（区块自动隐藏）
          #   SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY（可选）：启用账号与云端同步时填写；
          #                     留空则不注入，账号入口自动隐藏。
          #                     用 Variables 而非 Secrets —— publishable key 本就是公开的，
          #                     放进 Secrets 只会让构建更难排查。
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_FILMGRAB_BASE: ${{ vars.FILMGRAB_BASE }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          BASE_PATH="${{ vars.BASE_PATH }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"   # Custom Domain（根路径部署）用绝对 / 最稳；
                            # 若切回 github.io/<repo>/ 子路径，在仓库 Variables 里覆盖 BASE_PATH='./'
          fi
          echo "Using BASE_PATH=$BASE_PATH"
          BASE_PATH="$BASE_PATH" npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
