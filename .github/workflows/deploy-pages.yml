name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 同一时间只允许一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必须是 22+：@supabase/supabase-js 的 engines 要求 node >=22
          # （2.116.0 起；最后支持 20 的版本是 2.105.0）
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # 在仓库 Settings → Pages 选 "GitHub Actions" 作为发布源
          # 在 Settings → Secrets and variables → Actions → Variables 配置：
          #   API_BASE（必填）：Linux 服务器上的 API 域名，如 https://api.example.com
          #   BASE_PATH（可选）：默认 './'（相对路径，同时兼容 /<repo>/ 项目地址与自定义根域名）；
          #                     仅在有特殊需求时覆盖
          #   FILMGRAB_BASE（可选）：剧照服务挂载前缀，如
          #                     https://api.example.com/filmgrab；不部署则留空（区块自动隐藏）
          #   SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY（可选）：启用账号与云端同步时填写；
          #                     留空则不注入，账号入口自动隐藏。
          #                     用 Variables 而非 Secrets —— publishable key 本就是公开的，
          #                     放进 Secrets 只会让构建更难排查。
          #   （Secrets）PLAY_PASSWORD（可选）：在线播放的口令。**不配就整块照旧直开**，
          #                     配了才出现锁定卡 + 输入弹窗。这里用 Secrets 而非 Variables，
          #                     只是不让它出现在仓库设置页里；真实防护为零 —— 它是构建期
          #                     字面量，会原样编进 JS bundle，谁都能从源码里读出来。
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_FILMGRAB_BASE: ${{ vars.FILMGRAB_BASE }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAY_PASSWORD: ${{ secrets.PLAY_PASSWORD }}
        run: |
          BASE_PATH="${{ vars.BASE_PATH }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"   # 必须是**绝对**路径：'/' = 顶点自定义域名，'/<repo>/' = 项目子路径。
                            #
                            # ⚠️ 千万别改成相对 './'。2026-09-20 试过一次，**所有深链白屏**
                            # （首页正常，所以只看首页看不出来）。机理：
                            #   1. 深链 /movie/123-x 未匹配文件 → GitHub Pages 给 404.html
                            #   2. 404.html 把原路径塞进 _spa 跳回根 → 文档 URL 变成 /?_spa=...
                            #   3. index.html 的 <head> 内联脚本在 body 解析**之前**就
                            #      replaceState 回 /movie/123-x
                            #   4. 于是后面那个 <script src="./assets/index-*.js"> 按**新文档
                            #      URL** 解析 → /movie/assets/index-*.js → 404
                            #   5. 一个 JS 都没加载 → #root 空白 → 白屏
                            # 首页步骤 3 不变换 URL，'./assets/...' 才会解析成 '/assets/...'。
                            # 绝对路径对 replaceState 免疫，顶点和子路径两种布局都安全 ——
                            # 这也是运行时那个 getBasePath() 存在的意义（见 src/spaUrl.js）。
          fi
          echo "Using BASE_PATH=$BASE_PATH"
          BASE_PATH="$BASE_PATH" npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
