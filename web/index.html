<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMENFRAME - EVERY FRAME TELLS A STORY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // 与 public/404.html 配套：GitHub Pages 遇到未知路径（/movie/...、/library 等）
      // 会把我们送进 404.html，404.html 把完整原始路径编码到 _spa 再跳回根。
      // 这里在 React 挂载前把干净 URL 还原（replaceState：不刷新、不进历史栈）。
      ;(function () {
        try {
          var m = window.location.search.match(/(?:^|[?&])_spa=([^&]*)/)
          if (!m) return
          var target = decodeURIComponent(m[1])
          if (!target) return
          window.history.replaceState(null, '', target)
        } catch (e) { /* 解码失败直接忽略，用户就留在根路径 */ }
      })()
    </script>
  </head>
  <body style="background:#fff;color:#141414;font-family:'Inter',Arial,sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
