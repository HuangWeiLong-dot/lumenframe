<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LUMENFRAME</title>
    <script>
      // GitHub Pages 对未知路径（SPA 深链，如 /movie/123-dead-poets-society）
      // 返回本页。把目标路径编码到 _spa 参数并跳到站点根（根路径下相对资源
      // ./assets 才能正确解析）；index.html 的内联脚本会再把干净 URL 还原。
      ;(function () {
        var p = window.location.pathname
        var i = p.indexOf('/movie/')
        var base = i >= 0 ? p.slice(0, i + 1) : '/'
        var target = i >= 0 ? p.slice(i + 1) : ''
        var qs = window.location.search.replace(/^\?/, '')
        window.location.replace(
          base +
            '?_spa=' +
            encodeURIComponent(target) +
            (qs ? '&' + qs : '') +
            window.location.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
