<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LUMENFRAME</title>
    <script>
      // GitHub Pages / Nginx 共用的 SPA 深链回退。
      // 对任何无法在磁盘上找到的路径（/movie/...、/library、以及所有子路径），
      // 都把完整路径编码到 _spa 查询参数里，然后跳回根路径。
      // index.html 里的脚本会再把干净 URL 还原回来。
      ;(function () {
        var p = window.location.pathname || '/'
        var qs = window.location.search.replace(/^\?/, '')
        var hash = window.location.hash || ''
        // _spa 里存的是**完整**原始路径，index.html 按原样还原
        var target = p + (qs ? '?' + qs : '') + hash
        // 跳到根，同时带上原始路径；根路径下相对资源 ./assets 才能正确解析
        var rootPath = detectRoot(p)
        window.location.replace(rootPath + '?_spa=' + encodeURIComponent(target))

        // 从任意深链推导出项目根路径（兼容 GitHub Pages /repo/ 子路径、
        // 自定义域名根路径 '/'、以及 hash 部署等）。
        // 策略：按**路径分段**找第一个已知的路由/资源段，截断到它之前。
        // 不能用子串 indexOf：/<repo>/genre/movie/18-action 会先命中 'movie/'，
        // 算出 /<repo>/genre/ 这个不存在的目录，重定向过去又是一次 404 —— 死循环。
        // 判据与 src/spaUrl.js 的 getBasePath 保持一致，改一处必须改另一处。
        function detectRoot(path) {
          // 段表漏一个一级路由段就会出大事：/discover/tv 曾因缺 'discover' 把
          // 'tv' 误判成仓库前缀，根被算成 /discover/，跳过去的 /discover/?_spa=...
          // 又不是磁盘资产，再次进 404.html —— 每跳一层嵌套一次，死循环。
          var KNOWN = { movie: 1, tv: 1, person: 1, genre: 1, discover: 1, library: 1, assets: 1, api: 1, filmgrab: 1, 'card-studio': 1 }
          var segs = path.split('/')
          // segs[0] 恒为空串，从 1 开始
          for (var i = 1; i < segs.length; i++) {
            if (KNOWN[segs[i]]) return i === 1 ? '/' : '/' + segs.slice(1, i).join('/') + '/'
          }
          // 没匹配上任何已知段，保守返回最后一个 / 之前
          return path.lastIndexOf('/') > 0 ? path.slice(0, path.lastIndexOf('/') + 1) : '/'
        }
      })()
    </script>
  </head>
  <body></body>
</html>
